name: NPM Audit Fix Run

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Use --force flag for npm audit fix?"
        required: true
        type: boolean
      base_branch:
        description: "Specify a base branch"
        required: false
        default: "main"
      script:
        description: "Build script to run"
        required: false
        default: "npm run all"
      node_version:
        description: "Specify Node.js version (e.g., '18', '20', 'lts/*')"
        required: false
        default: "24"
      working_directory:
        description: "Working directories to run commands in (comma-separated, optional)"
        required: false
        type: string
        default: "github-action,merge,common,azdo-task/DevcontainersCi,azdo-task/DevcontainersMerge,.github/scripts"
  schedule:
    - cron: "0 0 * * 1"

jobs:
  audit-fix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - working_directory: github-action
            script: npm run all
          - working_directory: merge
            script: npm run all
          - working_directory: common
            script: npm run build
          - working_directory: azdo-task/DevcontainersCi
            script: npm run all
          - working_directory: azdo-task/DevcontainersMerge
            script: npm run all
          - working_directory: .github/scripts
            script: npm test
    uses: step-security/reusable-workflows/.github/workflows/audit_fix.yml@v1
    with:
      force: ${{ inputs.force || false }}
      base_branch: ${{ inputs.base_branch || 'main' }}
      script: ${{ matrix.script }}
      node_version: "${{ inputs.node_version || '24' }}"
      working_directory: ${{ matrix.working_directory }}

permissions:
  contents: write
  pull-requests: write
  packages: read
  issues: write
