---
name: CI (main)
# This workflow is triggered on pushes to main and runs tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: write
  checks: write

jobs:
  build-test-publish:
    name: "Build, test, publish"
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci_common.yml
